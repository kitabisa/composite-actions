name: "PR Opened"
description: "Validate PR branch naming convention, check GitHub issue or JIRA tickets, and auto-update PR body and title"

inputs:
  branch_regex:
    required: false
    description: "Regex pattern for branch name validation"
    default: '^([a-z]+)[\/]+(([a-zA-Z\-]+)-)?([0-9]{1,5})(\.[a-z]+|(-[a-z0-9\-]+)?)$'
    type: string

  allowed_prefixes:
    required: false
    description: "Comma-separated list of allowed branch prefixes"
    default: "feat/,fix/,docs/,chore/,ci/,test/,refactor/"
    type: string

  ignore_branches:
    required: false
    description: "Branches to ignore from validation"
    default: "master,main"
    type: string

  jira_base_url:
    required: false
    description: "Base URL for JIRA ticket links (only used for JIRA branches)"
    default: "https://kitabisa.atlassian.net/browse"
    type: string

  auto_update_body:
    required: false
    description: "Automatically update PR body with ticket link"
    default: "true"
    type: string

  auto_update_title:
    required: false
    description: "Automatically update PR title with ticket ID"
    default: "true"
    type: string

  gh_token:
    required: true
    description: "GitHub token for API operations"
    type: string

  check_branch_name:
    required: false
    description: "Enable branch naming convention validation"
    default: "true"
    type: string

  github_issue_keyword:
    required: false
    description: "Keyword for GitHub issue linking (e.g., Resolve, Fix, Close). Default: Resolve"
    default: "Resolve"
    type: string

outputs:
  branch_name:
    description: "The current branch name"
    value: ${{ steps.branch-name.outputs.current_branch }}

  ticket_type:
    description: "Type of ticket detected (GITHUB or JIRA)"
    value: ${{ steps.check-pr-updated.outputs.ticket_type }}

  ticket_id:
    description: "The detected ticket ID"
    value: ${{ steps.check-pr-updated.outputs.ticket_id }}

  body_updated:
    description: "Whether PR body was updated"
    value: ${{ steps.check-pr-updated.outputs.body_updated }}

  title_updated:
    description: "Whether PR title was updated"
    value: ${{ steps.check-pr-updated.outputs.title_updated }}

runs:
  using: "composite"
  steps:
    - name: Get branch name
      id: branch-name
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: echo "current_branch=${HEAD_REF:-$REF_NAME}" >> "$GITHUB_OUTPUT"

    - name: Check branch name
      id: check-branch-name
      if: ${{ inputs.check_branch_name == 'true' && !contains(github.head_ref, 'release-please') }}
      uses: deepakputhraya/action-branch-name@5f1cc199284b75145ec2d13434422e6987cf6af8 # master
      with:
        regex: ${{ inputs.branch_regex }}
        allowed_prefixes: ${{ inputs.allowed_prefixes }}
        ignore: ${{ inputs.ignore_branches }}

    - name: Fail and comment on PR if branch name is incorrect
      if: ${{ inputs.check_branch_name == 'true' && !contains(github.head_ref, 'release-please') && failure() && steps.check-branch-name.outcome == 'failure' }}
      uses: actions/github-script@v9
      env:
        ALLOWED_PREFIXES: ${{ inputs.allowed_prefixes }}
        BRANCH_REGEX: ${{ inputs.branch_regex }}
      with:
        github-token: ${{ inputs.gh_token }}
        script: |
          const branchName = context.payload.pull_request.head.ref;
          const prefixes = process.env.ALLOWED_PREFIXES.split(',').map(p => p.trim());

          const reasons = [];
          if (!prefixes.some(p => branchName.startsWith(p))) {
            reasons.push(`- Prefix must be one of: ${prefixes.map(p => `\`${p}\``).join(', ')}`);
          }
          reasons.push(`- Name must match \`${process.env.BRANCH_REGEX}\``);

          const marker = '<!-- pr-check-branch-name -->';
          const body = `${marker}\n🚫 The branch name \`${branchName}\` is not valid.\n\n${reasons.join('\n')}\n\nExamples with the default pattern: \`feat/123-wakaf\` (GitHub issue) or \`feat/sdet-123-wakaf\` (JIRA)\n\nRename the branch and re-open the PR.`;

          // update the previous comment instead of posting a new one on every push
          const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
          const comments = await github.paginate(github.rest.issues.listComments, issue);
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ ...issue, body });
          }

    - name: Check PR body and title for Github issue/JIRA ticket
      id: check-pr-updated
      shell: bash
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
      run: |
        headbranch="$PR_HEAD_REF"

        # ticket must come right after the prefix: feat/123-x (GitHub issue) or feat/SDET-123-x (JIRA)
        github_re='^[^/]+/([0-9]+)([-.]|$)'
        jira_re='^[^/]+/([A-Za-z]+)-([0-9]+)([^0-9]|$)'

        if [[ "$headbranch" =~ $github_re ]]; then
          TYPE="GITHUB"
          TICKET="${BASH_REMATCH[1]}"
        elif [[ "$headbranch" =~ $jira_re ]]; then
          TYPE="JIRA"
          KEY=$(tr '[:lower:]' '[:upper:]' <<< "${BASH_REMATCH[1]}")
          TICKET="$KEY-${BASH_REMATCH[2]}"
        else
          echo "No ticket found in branch: $headbranch"
          echo "body_updated=false" >> $GITHUB_OUTPUT
          echo "title_updated=false" >> $GITHUB_OUTPUT
          echo "ticket_type=" >> $GITHUB_OUTPUT
          echo "ticket_id=" >> $GITHUB_OUTPUT
          exit 0
        fi

        body="$PR_BODY"
        title="$PR_TITLE"

        echo "Detected Type: $TYPE"
        echo "Detected Ticket: $TICKET"
        echo "ticket_type=$TYPE" >> $GITHUB_OUTPUT
        echo "ticket_id=$TICKET" >> $GITHUB_OUTPUT

        if [[ "$TYPE" == "JIRA" ]]; then
          if grep -qiE "$JIRA_BASE_URL/$TICKET([^0-9]|$)" <<< "$body"; then
            echo "body_updated=true" >> $GITHUB_OUTPUT
          else
            echo "body_updated=false" >> $GITHUB_OUTPUT
          fi
        else
          if grep -qEi "(Close|Closes|Closed|Fix|Fixes|Fixed|Resolve|Resolves|Resolved) #$TICKET([^0-9]|$)" <<< "$body"; then
            echo "body_updated=true" >> $GITHUB_OUTPUT
          else
            echo "body_updated=false" >> $GITHUB_OUTPUT
          fi
        fi

        # GitHub issues are linked through the body only, the title is left as is
        if [[ "$TYPE" == "GITHUB" ]]; then
          echo "title_updated=true" >> $GITHUB_OUTPUT
        elif grep -qiE "(^|[^A-Za-z0-9-])$TICKET([^0-9]|$)" <<< "$title"; then
          echo "title_updated=true" >> $GITHUB_OUTPUT
        else
          echo "title_updated=false" >> $GITHUB_OUTPUT
        fi

    - name: Update PR body
      if: ${{ inputs.auto_update_body == 'true' && steps.check-pr-updated.outputs.ticket_id != '' && steps.check-pr-updated.outputs.body_updated == 'false' }}
      uses: actions/github-script@v9
      env:
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        GITHUB_ISSUE_KEYWORD: ${{ inputs.github_issue_keyword }}
        TICKET_TYPE: ${{ steps.check-pr-updated.outputs.ticket_type }}
        TICKET_ID: ${{ steps.check-pr-updated.outputs.ticket_id }}
      with:
        github-token: ${{ inputs.gh_token }}
        script: |
          const { repo, payload } = context;
          const type = process.env.TICKET_TYPE;
          const ticket = process.env.TICKET_ID;

          const header = type === 'JIRA' ? '## :tickets: JIRA Ticket' : '## :tickets: Github Ticket';
          const newSection = type === 'JIRA'
            ? `${header}\n[${ticket}](${process.env.JIRA_BASE_URL}/${ticket})`
            : `${header}\n${process.env.GITHUB_ISSUE_KEYWORD} #${ticket}`;

          // the event payload can be stale, so read the current body before overwriting it
          const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: payload.pull_request.number });
          const currentBody = pr.body || '';

          let updatedBody;
          if (currentBody.includes(header)) {
            // replace the managed section up to the next "## " heading
            const regex = new RegExp(header + '[\\s\\S]*?(?=\\s*\\n## |$)', 'i');
            updatedBody = currentBody.replace(regex, () => newSection);
          } else {
            updatedBody = `${newSection}\n\n${currentBody}`;
          }

          await github.rest.pulls.update({
            ...repo,
            pull_number: payload.pull_request.number,
            body: updatedBody
          });

    - name: Update PR title
      if: ${{ inputs.auto_update_title == 'true' && steps.check-pr-updated.outputs.ticket_id != '' && steps.check-pr-updated.outputs.title_updated == 'false' }}
      uses: actions/github-script@v9
      env:
        TICKET_ID: ${{ steps.check-pr-updated.outputs.ticket_id }}
      with:
        github-token: ${{ inputs.gh_token }}
        script: |
          const { repo, payload } = context;
          const ticket = process.env.TICKET_ID;

          // the event payload can be stale, so read the current title before overwriting it
          const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: payload.pull_request.number });
          // same boundaries as the bash check, so SDET-12 is not matched by SDET-123
          if (new RegExp(`(^|[^A-Za-z0-9-])${ticket}(?![0-9])`, 'i').test(pr.title)) return;

          await github.rest.pulls.update({
            ...repo,
            pull_number: payload.pull_request.number,
            title: `${pr.title} ${ticket}`
          });
