name: Actions lockfile

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  relock:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --relock
        env:
          GH_TOKEN: ${{ github.token }}
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.KITABISA_SECURITY_APP_ID }}
          private-key: ${{ secrets.KITABISA_SECURITY_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/relock-actions
          commit-message: "chore(ci): relock GitHub Actions dependencies"
          title: "chore(ci): relock GitHub Actions dependencies"
