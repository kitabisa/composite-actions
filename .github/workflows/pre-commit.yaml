name: pre-commit check

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

env:
 BRANCH: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: pre-commit-check
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: pre-commit check
      if: steps.branch-name.outputs.current_branch != 'release-please--branches--main'
      uses: cloudposse/github-action-pre-commit@v4.0.0
      env:
        SKIP: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'branch-convention' || '' }}
